[project]
name = "mutation-analysis"
version = "1.0.0"
description = "Mutation analysis pipeline for breseq output files"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "openpyxl",
]

[project.scripts]
mutanalysis = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modules"]
py-modules = ["main"]
